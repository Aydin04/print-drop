<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aydin Print — Kirim & Cetak Otomatis</title>
    <!-- Cropper.js for Interactive Photo Crop/Zoom -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; padding: 12px; display: flex; justify-content: center; }
        .wrapper { width: 100%; max-width: 500px; padding-bottom: 40px; }

        .header { text-align: center; padding: 15px 0 10px; }
        .header h1 { font-size: 24px; color: #38bdf8; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        /* Tabs */
        .tabs { display: flex; background: #0b1120; border-radius: 12px; padding: 4px; margin-bottom: 16px; border: 1px solid var(--card-border); }
        .tab-btn { flex: 1; padding: 10px; text-align: center; border: none; background: transparent; color: var(--text-muted); font-weight: 600; font-size: 14px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: #fff; }

        /* Cards */
        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--card-border); margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--card-border); background: #0b1120; color: #fff; font-size: 15px; outline: none; transition: 0.2s;
        }
        input[type="text"]:focus, select:focus, textarea:focus { border-color: #38bdf8; }

        /* File Upload Box */
        .file-dropzone {
            border: 2px dashed #475569; border-radius: 12px; padding: 22px 16px; text-align: center; background: #0b1120; cursor: pointer; transition: 0.2s;
        }
        .file-dropzone:hover { border-color: #38bdf8; background: #131d33; }
        .file-dropzone input { display: none; }
        .drop-icon { font-size: 32px; margin-bottom: 6px; }
        .drop-title { font-size: 15px; font-weight: 700; color: #38bdf8; }
        .drop-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        /* File Preview List */
        .preview-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .preview-item { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--card-border); font-size: 13px; }
        .preview-thumb { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; background: #334155; margin-right: 10px; }

        /* Cropper Container */
        #cropperModal { display: none; margin-top: 15px; background: #0b1120; padding: 14px; border-radius: 12px; border: 1px solid var(--card-border); }
        .img-container { max-height: 280px; width: 100%; overflow: hidden; background: #000; border-radius: 8px; }
        .crop-controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .crop-btn { padding: 6px 12px; background: #334155; color: #fff; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .crop-btn.active { background: #0284c7; }

        /* Chips & Options */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .chip-group { display: flex; gap: 8px; }
        .chip { flex: 1; text-align: center; padding: 10px; border-radius: 8px; border: 1.5px solid var(--card-border); background: #0b1120; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .chip.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.15); color: #38bdf8; }

        /* Price Summary Bar */
        .price-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1.5px solid #0284c7; border-radius: 14px; padding: 16px; margin-top: 16px; }
        .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); }
        .price-total { font-size: 22px; font-weight: 800; color: #4ade80; }

        /* Submit Button */
        .btn-submit { width: 100%; padding: 16px; background: #0284c7; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); margin-top: 15px; }
        .btn-submit:disabled { background: #475569; box-shadow: none; cursor: not-allowed; }

        /* Progress & Status */
        .progress-box { margin-top: 14px; display: none; background: #334155; border-radius: 8px; overflow: hidden; height: 12px; }
        .progress-bar { width: 0%; height: 100%; background: #22c55e; transition: width 0.15s; }
        .alert { margin-top: 14px; padding: 14px; border-radius: 10px; display: none; font-size: 14px; text-align: center; }
        .alert-success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #4ade80; }
        .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1>🖨️ Aydin Print</h1>
        <p>Transfer File Cepat & Auto Cetak Presisi</p>
    </div>

    <!-- Mode Switcher -->
    <div class="tabs">
        <button class="tab-btn active" id="tabDoc" onclick="switchMode('document')">📄 Dokumen / Fotocopy</button>
        <button class="tab-btn" id="tabPhoto" onclick="switchMode('photo_custom')">📸 Pas Foto & Kustom</button>
    </div>

    <form id="mainForm">
        <div class="card">
            <div class="form-group">
                <label>👤 Nama Pemesan / Pelanggan:</label>
                <input type="text" id="custName" placeholder="Contoh: Pak Budi / Rina" required>
            </div>

            <!-- MODE DOKUMEN -->
            <div id="sectionDoc">
                <div class="form-group">
                    <label>📂 Pilih File Dokumen / Gambar (PDF, Word, JPG, PNG):</label>
                    <div class="file-dropzone" onclick="document.getElementById('docFiles').click()">
                        <div class="drop-icon">📑</div>
                        <div class="drop-title">Ketuk untuk Pilih File</div>
                        <div class="drop-desc">Bisa pilih banyak file sekaligus</div>
                    </div>
                    <input type="file" id="docFiles" multiple onchange="handleDocFiles(this)">
                    <div class="preview-list" id="docPreviewList"></div>
                </div>

                <div class="options-grid">
                    <div class="form-group">
                        <label>Warna Cetak:</label>
                        <div class="chip-group">
                            <div class="chip active" id="chipColor" onclick="setColorMode('COLOR')">🌈 Warna</div>
                            <div class="chip" id="chipBw" onclick="setColorMode('BW')">⚫ Hitam Putih</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Cetak Bolak-Balik (Duplex):</label>
                        <div class="chip-group">
                            <div class="chip active" id="chipSimplex" onclick="setDuplex(false)">1 Sisi</div>
                            <div class="chip" id="chipDuplex" onclick="setDuplex(true)">Bolak-Balik</div>
                        </div>
                    </div>
                </div>

                <div class="options-grid">
                    <div class="form-group">
                        <label>Pilihan Kertas:</label>
                        <select id="docPaperSelect" onchange="recalculatePrice()">
                            {% for p in db.papers %}
                            <option value="{{ p.id }}">{{ p.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Jumlah Lembar / Rangkap:</label>
                        <input type="number" id="docQty" min="1" value="1" oninput="recalculatePrice()">
                    </div>
                </div>

                <div class="form-group">
                    <label>Aksesoris Tambahan (Opsional):</label>
                    <select id="docAccessorySelect" onchange="recalculatePrice()">
                        <option value="">-- Tanpa Aksesoris --</option>
                        {% for a in db.accessories %}
                        <option value="{{ a.id }}">{{ a.name }} (+Rp {{ '{:,}'.format(a.selling_price) }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- MODE PAS FOTO & KUSTOM TEMPLATE -->
            <div id="sectionPhoto" style="display:none;">
                <div class="form-group">
                    <label>Pilih Preset Ukuran / Template:</label>
                    <select id="photoPresetSelect" onchange="handlePresetChange()">
                        {% for pr in db.presets %}
                        <option value="{{ pr.id }}" data-w="{{ pr.photo_width_mm }}" data-h="{{ pr.photo_height_mm }}" data-paper="{{ pr.paper_id }}" data-acc="{{ pr.accessory_id or '' }}">{{ pr.name }} ({{ pr.category }})</option>
                        {% endfor %}
                        <option value="custom">📐 Custom Ukuran Bebas (mm)</option>
                    </select>
                </div>

                <div class="options-grid" id="customSizeBox" style="display:none;">
                    <div class="form-group">
                        <label>Lebar Foto (mm):</label>
                        <input type="number" id="customW" value="28" oninput="updateCropRatio(); recalculatePrice();">
                    </div>
                    <div class="form-group">
                        <label>Tinggi Foto (mm):</label>
                        <input type="number" id="customH" value="38" oninput="updateCropRatio(); recalculatePrice();">
                    </div>
                </div>

                <div class="form-group">
                    <label>📸 Upload Foto yang Mau Dicetak:</label>
                    <div class="file-dropzone" onclick="document.getElementById('photoFile').click()">
                        <div class="drop-icon">🖼️</div>
                        <div class="drop-title">Pilih Foto dari Galeri / Kamera</div>
                        <div class="drop-desc">Format JPG, PNG, WebP</div>
                    </div>
                    <input type="file" id="photoFile" accept="image/*" onchange="handlePhotoSelect(this)">
                </div>

                <!-- Interactive Cropper -->
                <div id="cropperModal">
                    <label style="color:#38bdf8;">✂️ Geser / Zoom / Posisikan Bagian Foto:</label>
                    <div class="img-container">
                        <img id="imageToCrop" src="" alt="Crop Image">
                    </div>
                    <div class="crop-controls">
                        <button type="button" class="crop-btn" onclick="cropper.zoom(0.1)">🔍 Zoom In</button>
                        <button type="button" class="crop-btn" onclick="cropper.zoom(-0.1)">🔍 Zoom Out</button>
                        <button type="button" class="crop-btn" onclick="cropper.rotate(90)">🔄 Putar</button>
                        <button type="button" class="crop-btn" onclick="cropper.reset()">♻️ Reset</button>
                    </div>
                </div>

                <div class="options-grid" style="margin-top:12px;">
                    <div class="form-group">
                        <label>Jumlah Foto (Pcs):</label>
                        <input type="number" id="photoQty" min="1" value="4" oninput="recalculatePrice()">
                    </div>
                    <div class="form-group">
                        <label>Kertas Cetak:</label>
                        <select id="photoPaperSelect" onchange="recalculatePrice()">
                            {% for p in db.papers %}
                            <option value="{{ p.id }}" {% if p.size == 'A4' and 'Photo' in p.name %}selected{% endif %}>{{ p.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Aksesoris / Casing (Opsional):</label>
                    <select id="photoAccessorySelect" onchange="recalculatePrice()">
                        <option value="">-- Tanpa Aksesoris --</option>
                        {% for a in db.accessories %}
                        <option value="{{ a.id }}">{{ a.name }} (+Rp {{ '{:,}'.format(a.selling_price) }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Catatan Tambahan untuk Kasir (Opsional):</label>
                <textarea id="orderNote" rows="2" placeholder="Contoh: Halaman 1-4 saja, potong rapi, dll"></textarea>
            </div>

            <!-- Price Breakdown Summary -->
            <div class="price-card">
                <div class="price-row">
                    <span>Estimasi Biaya Cetak:</span>
                    <span id="labelPrintCost">Rp 0</span>
                </div>
                <div class="price-row" id="rowAccessory" style="display:none;">
                    <span>Aksesoris Tambahan:</span>
                    <span id="labelAccessoryCost">Rp 0</span>
                </div>
                <div class="price-row" style="margin-top:8px; border-top:1px dashed var(--card-border); padding-top:8px;">
                    <span style="font-weight:700; color:#fff;">Total Estimasi:</span>
                    <span class="price-total" id="labelTotalPrice">Rp 0</span>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">🚀 Kirim File ke Kasir</button>
            <div class="progress-box" id="pBox"><div class="progress-bar" id="pBar"></div></div>
            <div class="alert" id="alertBox"></div>
        </div>
    </form>
</div>

<script>
let currentMode = 'document';
let colorMode = 'COLOR';
let isDuplex = false;
let cropper = null;
let currentEstimatedTotal = 0;

function switchMode(mode) {
    currentMode = mode;
    document.getElementById('tabDoc').classList.toggle('active', mode === 'document');
    document.getElementById('tabPhoto').classList.toggle('active', mode === 'photo_custom');
    document.getElementById('sectionDoc').style.display = mode === 'document' ? 'block' : 'none';
    document.getElementById('sectionPhoto').style.display = mode === 'photo_custom' ? 'block' : 'none';
    recalculatePrice();
}

function setColorMode(mode) {
    colorMode = mode;
    document.getElementById('chipColor').classList.toggle('active', mode === 'COLOR');
    document.getElementById('chipBw').classList.toggle('active', mode === 'BW');
    recalculatePrice();
}

function setDuplex(val) {
    isDuplex = val;
    document.getElementById('chipSimplex').classList.toggle('active', !val);
    document.getElementById('chipDuplex').classList.toggle('active', val);
    recalculatePrice();
}

function handleDocFiles(input) {
    const list = document.getElementById('docPreviewList');
    list.innerHTML = '';
    if (input.files.length > 0) {
        document.getElementById('docQty').value = input.files.length;
        Array.from(input.files).forEach(f => {
            const item = document.createElement('div');
            item.className = 'preview-item';
            item.innerHTML = '<span>📄 <b>' + f.name + '</b> (' + (f.size / 1024).toFixed(1) + ' KB)</span>';
            list.appendChild(item);
        });
    }
    recalculatePrice();
}

function handlePresetChange() {
    const select = document.getElementById('photoPresetSelect');
    const opt = select.options[select.selectedIndex];
    const isCustom = select.value === 'custom';
    document.getElementById('customSizeBox').style.display = isCustom ? 'grid' : 'none';

    if (!isCustom) {
        const paperId = opt.getAttribute('data-paper');
        const accId = opt.getAttribute('data-acc');
        if (paperId) document.getElementById('photoPaperSelect').value = paperId;
        if (accId) document.getElementById('photoAccessorySelect').value = accId;
    }
    updateCropRatio();
    recalculatePrice();
}

function getPhotoDimensions() {
    const select = document.getElementById('photoPresetSelect');
    if (select.value === 'custom') {
        return {
            w: parseFloat(document.getElementById('customW').value) || 28,
            h: parseFloat(document.getElementById('customH').value) || 38
        };
    }
    const opt = select.options[select.selectedIndex];
    return {
        w: parseFloat(opt.getAttribute('data-w')) || 28,
        h: parseFloat(opt.getAttribute('data-h')) || 38
    };
}

function updateCropRatio() {
    if (!cropper) return;
    const dims = getPhotoDimensions();
    cropper.setAspectRatio(dims.w / dims.h);
}

function handlePhotoSelect(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.getElementById('imageToCrop');
            img.src = e.target.result;
            document.getElementById('cropperModal').style.display = 'block';

            if (cropper) cropper.destroy();
            const dims = getPhotoDimensions();
            cropper = new Cropper(img, {
                aspectRatio: dims.w / dims.h,
                viewMode: 1,
                autoCropArea: 0.9,
                responsive: true
            });
        };
        reader.readAsDataURL(input.files[0]);
    }
}

async function recalculatePrice() {
    let payload = {};
    if (currentMode === 'document') {
        payload = {
            mode: 'document',
            quantity: parseInt(document.getElementById('docQty').value) || 1,
            paper_id: parseInt(document.getElementById('docPaperSelect').value),
            color_mode: colorMode,
            duplex: isDuplex,
            accessory_id: document.getElementById('docAccessorySelect').value || null
        };
    } else {
        const dims = getPhotoDimensions();
        const select = document.getElementById('photoPresetSelect');
        payload = {
            mode: 'photo_custom',
            preset_id: select.value !== 'custom' ? select.value : null,
            photo_w_mm: dims.w,
            photo_h_mm: dims.h,
            quantity: parseInt(document.getElementById('photoQty').value) || 1,
            paper_id: parseInt(document.getElementById('photoPaperSelect').value),
            accessory_id: document.getElementById('photoAccessorySelect').value || null
        };
    }

    try {
        const res = await fetch('/api/calculate-price', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        currentEstimatedTotal = data.total_price;

        document.getElementById('labelPrintCost').innerText = 'Rp ' + data.print_cost_total.toLocaleString();
        if (data.accessory_price_total > 0) {
            document.getElementById('rowAccessory').style.display = 'flex';
            document.getElementById('labelAccessoryCost').innerText = 'Rp ' + data.accessory_price_total.toLocaleString();
        } else {
            document.getElementById('rowAccessory').style.display = 'none';
        }
        document.getElementById('labelTotalPrice').innerText = 'Rp ' + data.total_price.toLocaleString();
    } catch (e) {
        console.error(e);
    }
}

document.getElementById('mainForm').onsubmit = function(e) {
    e.preventDefault();
    const nama = document.getElementById('custName').value.trim();
    if (!nama) return alert('Silakan masukkan nama pemesan.');

    const formData = new FormData();
    formData.append('nama', nama);
    formData.append('mode', currentMode);
    formData.append('catatan', document.getElementById('orderNote').value.trim());
    formData.append('total_price', currentEstimatedTotal);

    if (currentMode === 'document') {
        const files = document.getElementById('docFiles').files;
        if (files.length === 0) return alert('Silakan pilih minimal 1 file dokumen.');
        for (let i = 0; i < files.length; i++) formData.append('files', files[i]);

        formData.append('color_mode', colorMode);
        formData.append('duplex', isDuplex);
        formData.append('paper_id', document.getElementById('docPaperSelect').value);
        formData.append('quantity', document.getElementById('docQty').value);
        formData.append('accessory_id', document.getElementById('docAccessorySelect').value);
    } else {
        const photoInput = document.getElementById('photoFile');
        if (!photoInput.files || photoInput.files.length === 0) return alert('Silakan upload foto terlebih dahulu.');
        formData.append('files', photoInput.files[0]);

        const dims = getPhotoDimensions();
        formData.append('photo_w_mm', dims.w);
        formData.append('photo_h_mm', dims.h);
        formData.append('paper_id', document.getElementById('photoPaperSelect').value);
        formData.append('quantity', document.getElementById('photoQty').value);
        formData.append('accessory_id', document.getElementById('photoAccessorySelect').value);

        if (cropper) {
            formData.append('crop_data', JSON.stringify(cropper.getData(true)));
        }
    }

    const btn = document.getElementById('btnSubmit');
    const pBox = document.getElementById('pBox');
    const pBar = document.getElementById('pBar');
    const alertBox = document.getElementById('alertBox');

    btn.disabled = true;
    btn.innerText = 'Mengirim Pesanan...';
    pBox.style.display = 'block';
    alertBox.style.display = 'none';

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload', true);
    xhr.upload.onprogress = (evt) => {
        if (evt.lengthComputable) {
            pBar.style.width = Math.round((evt.loaded / evt.total) * 100) + '%';
        }
    };
    xhr.onload = () => {
        btn.disabled = false;
        btn.innerText = '🚀 Kirim File ke Kasir';
        if (xhr.status === 200) {
            const res = JSON.parse(xhr.responseText);
            alertBox.className = 'alert alert-success';
            alertBox.innerHTML = '🎉 <b>Pesanan Berhasil Dikirim!</b><br>Total Biaya: <b>Rp ' + res.total_price.toLocaleString() + '</b><br>Silakan infokan nama <b>' + nama + '</b> ke kasir.';
            alertBox.style.display = 'block';
            document.getElementById('mainForm').reset();
            if (cropper) { cropper.destroy(); cropper = null; }
            document.getElementById('cropperModal').style.display = 'none';
            document.getElementById('docPreviewList').innerHTML = '';
        } else {
            alertBox.className = 'alert alert-error';
            alertBox.innerText = '❌ Gagal mengirim pesanan. Silakan coba lagi.';
            alertBox.style.display = 'block';
        }
    };
    xhr.send(formData);
};

// Initial calculation
recalculatePrice();
</script>
</body>
</html>
